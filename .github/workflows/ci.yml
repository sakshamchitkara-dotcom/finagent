name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,llm]"
      - name: Sample data is reproducible
        run: |
          python scripts/gen_sample_data.py
          git diff --exit-code data/sample
      - run: pytest -q
      - name: Smoke test CLI (no API key, paper only, offline sample data)
        run: |
          finagent backtest --trailing-stop 0.1 --out reports/ci
          test -s reports/ci/round_trips.csv
          finagent backtest --strategy breakout --stop-loss 0.08 --take-profit 0.3 --trailing-stop 0.1 \
            --stop-basis high --monte-carlo 500 --out reports/ci/breakout | tee reports/ci/breakout.txt
          grep -q "mc_return_p50" reports/ci/breakout.txt
          grep -q "Open positions and exit levels" reports/ci/breakout/report.html
          finagent backtest --trailing-stop 0.1 --regime-filter SYN_INDEX --out reports/ci/regime
          finagent compare reports/ci reports/ci/regime | grep -q "risk.regime_symbol"
          finagent sweep --symbols SYN_TECH --regime-filter SYN_INDEX --grid regime_sma=100,200 \
            --out reports/ci/regime_sweep.csv
          finagent sweep --symbols SYN_TECH SYN_UTIL --grid entry=0.3,0.4 --out reports/ci/sweep.csv
          finagent walkforward --symbols SYN_TECH --grid entry=0.3,0.4 --train-days 252 --test-days 252 \
            --out reports/ci/walkforward.csv
          finagent run --once --db state/ci.db --trailing-stop 0.1 --stop-loss 0.08
          finagent run --once --db state/ci.db --trailing-stop 0.1 --stop-loss 0.08 | grep -q "mode=no new bar"
          finagent portfolio --db state/ci.db
          finagent report --db state/ci.db --out reports/ci/paper.html

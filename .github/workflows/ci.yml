name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,llm]"
      - name: Sample data is reproducible
        run: |
          python scripts/gen_sample_data.py
          git diff --exit-code data/sample
      - run: pytest -q
      - name: Smoke test CLI (no API key, paper only)
        run: |
          finagent backtest --out reports/ci
          finagent run --once --db state/ci.db
          finagent portfolio --db state/ci.db
          finagent report --db state/ci.db --out reports/ci/paper.html
